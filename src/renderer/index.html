<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>音乐播放器</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="./styles/style.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#1DB954',
            secondary: '#191414',
            dark: '#121212',
            light: '#F8F8F8',
            sidebar: '#181818',
            hover: '#282828',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      }
    }
  </script>
</head>

<body class="min-h-screen bg-gray-100 text-gray-800 dark:bg-gray-900 dark:text-white">

  <!-- 主界面 -->
  <div id="mainInterface" class="flex h-screen overflow-hidden">
    <!-- 左侧导航栏 -->
    <div class="w-64 bg-gray-200 border-r border-gray-300 flex flex-col dark:bg-gray-800 dark:border-gray-700"
      id="sidebar">
      <!-- 可拖动调整手柄 -->
      <div
        class="absolute top-0 bottom-0 right-0 w-1 bg-gray-300 cursor-col-resize hover:bg-gray-400 transition-colors duration-200 dark:bg-gray-700 dark:hover:bg-gray-600"
        id="sidebarResizer"></div>
      <!-- 用户信息 -->
      <div class="p-4 border-b border-gray-300 dark:border-gray-700">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center">
              <span class="text-white font-semibold">AH</span>
            </div>
            <div>
              <div class="font-medium">用户信息</div>
              <div class="text-xs text-gray-400 dark:text-gray-500">用户消息</div>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <button id="importUserBtn"
              class="p-1 rounded hover:bg-gray-300 transition-colors duration-200 dark:hover:bg-gray-700 relative group"
              title="导入用户信息">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-600 dark:text-gray-300" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
              </svg>
              <span
                class="absolute bottom-full left-1/2 transform -translate-x-1/2 mb-1 px-2 py-1 bg-gray-800 text-white text-xs rounded opacity-0 group-hover:opacity-100 transition-opacity duration-200 whitespace-nowrap">导入用户信息</span>
            </button>
            <button id="exportUserBtn"
              class="p-1 rounded hover:bg-gray-300 transition-colors duration-200 dark:hover:bg-gray-700 relative group"
              title="导出用户信息">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-600 dark:text-gray-300" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
              </svg>
              <span
                class="absolute bottom-full left-1/2 transform -translate-x-1/2 mb-1 px-2 py-1 bg-gray-800 text-white text-xs rounded opacity-0 group-hover:opacity-100 transition-opacity duration-200 whitespace-nowrap">导出用户信息</span>
            </button>
            <button id="checkUpdateBtn"
              class="p-1 rounded hover:bg-gray-300 transition-colors duration-200 dark:hover:bg-gray-700 relative group"
              title="检查更新">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-600 dark:text-gray-300" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
              </svg>
              <span
                class="absolute bottom-full left-1/2 transform -translate-x-1/2 mb-1 px-2 py-1 bg-gray-800 text-white text-xs rounded opacity-0 group-hover:opacity-100 transition-opacity duration-200 whitespace-nowrap">检查更新</span>
              <span id="updateBadge"
                class="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full opacity-0 transition-opacity duration-200"></span>
            </button>
          </div>
        </div>
      </div>

      <!-- 常用功能 -->
      <div class="p-4">
        <div class="mb-6">
          <button id="followedSongsBtn"
            class="w-full flex items-center gap-3 p-2 rounded hover:bg-gray-300 transition-colors duration-200 dark:hover:bg-gray-700">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-primary" fill="currentColor" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            <span>关注歌手</span>
            <span class="ml-auto text-xs text-gray-400 dark:text-gray-500" id="followCount">0</span>
          </button>
        </div>

        <div class="mb-6">
          <button id="likeSongsBtn"
            class="w-full flex items-center gap-3 p-2 rounded hover:bg-gray-300 transition-colors duration-200 dark:hover:bg-gray-700">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-primary" fill="currentColor" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
            </svg>
            <span>我喜欢</span>
            <span class="ml-auto text-xs text-gray-400 dark:text-gray-500" id="likeCount">0</span>
          </button>
        </div>

        <div class="mb-6">
          <button id="recentPlayBtn"
            class="w-full flex items-center gap-3 p-2 rounded hover:bg-gray-300 transition-colors duration-200 dark:hover:bg-gray-700">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span>最近播放</span>
            <span class="ml-auto text-xs text-gray-400 dark:text-gray-500" id="recentCount">0</span>
          </button>
        </div>

        <div class="mb-6">
          <button id="localSongsBtn"
            class="w-full flex items-center gap-3 p-2 rounded hover:bg-gray-300 transition-colors duration-200 dark:hover:bg-gray-700">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <span>本地和下载</span>
            <span class="ml-auto text-xs text-gray-400 dark:text-gray-500" id="localCount">0</span>
          </button>
        </div>


      </div>

      <!-- 自定义歌单 -->
      <div class="flex-1 overflow-y-auto">
        <div class="p-4 border-t border-gray-300 dark:border-gray-700">
          <div class="flex items-center justify-between mb-4">
            <h3 class="font-medium">自定义歌单</h3>
            <div class="flex items-center gap-1">
              <button id="importWebPlaylistBtn" type="button"
                class="text-primary hover:text-primary/80 transition-colors duration-200 p-1 rounded hover:bg-gray-300 dark:hover:bg-gray-700"
                title="从网页导入歌单（网易云 / QQ音乐）">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                  stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
                </svg>
              </button>
              <button id="createPlaylistBtn" class="text-primary hover:text-primary/80 transition-colors duration-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                  stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                </svg>
              </button>
            </div>
          </div>
          <ul id="playlistSidebarList" class="space-y-2">
            <!-- 自定义歌单动态渲染 -->
          </ul>
        </div>
      </div>
    </div>

    <!-- 主内容区 -->
    <div class="flex-1 flex flex-col overflow-hidden">
      <!-- 顶部搜索栏 -->
      <div class="p-4 border-b border-gray-700 flex items-center gap-3 dark:border-gray-700">
        <!-- 返回按钮 -->
        <button id="backToSearchBtn"
          class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-300 hover:bg-gray-400 text-gray-800 transition-all duration-200 dark:bg-gray-700 dark:text-white dark:hover:bg-gray-600 hidden flex-shrink-0"
          title="返回">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
        </button>
        <div class="relative flex-1">
          <input type="text" id="searchInput"
            class="w-full bg-gray-100 border border-gray-300 rounded-full py-2 px-4 pl-10 focus:outline-none focus:ring-2 focus:ring-primary/50 text-gray-800 dark:bg-gray-800 dark:border-gray-600 dark:text-white"
            placeholder="搜索音乐">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 absolute left-3 top-2.5 text-gray-400" fill="none"
            viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <!-- 搜索历史记录 -->
          <div id="searchHistoryContainer"
            class="absolute top-full left-0 right-0 bg-white border border-gray-300 rounded-lg shadow-lg mt-1 z-40 hidden dark:bg-gray-800 dark:border-gray-700">
            <div class="max-h-[200px] overflow-y-auto">
              <ul id="searchHistoryList" class="divide-y divide-gray-200 dark:divide-gray-700">
                <!-- 搜索历史动态渲染 -->
              </ul>
            </div>
          </div>
          <button id="clearSearchBtn"
            class="absolute right-3 top-2.5 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 hidden"
            aria-label="清空搜索">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
        <!-- 清除缓存并搜索按钮 -->
        <button id="clearCacheBtn"
          class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-2 px-4 rounded-full transition-all duration-200 dark:bg-gray-700 dark:text-white dark:hover:bg-gray-600 flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14v6m-3-3h6" />
          </svg>
          清除缓存
        </button>

        <!-- 搜索源选择按钮 -->
        <div class="relative">
          <button id="searchSourceBtn"
            class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-2 px-4 rounded-full transition-all duration-200 dark:bg-gray-700 dark:text-white dark:hover:bg-gray-600 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
            </svg>
            搜索源
          </button>
          <!-- 搜索源选择下拉菜单 -->
          <div id="searchSourceMenu"
            class="absolute top-full right-0 mt-2 w-80 bg-white border border-gray-300 rounded-lg shadow-lg z-50 hidden dark:bg-gray-800 dark:border-gray-700">
            <div class="p-4">
              <h4 class="font-medium mb-4 text-lg dark:text-white">选择搜索源</h4>
              <div class="space-y-3 max-h-80 overflow-y-auto">
                <div
                  class="flex items-center gap-3 p-2 rounded hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200">
                  <input type="checkbox" id="source-netease"
                    class="rounded text-primary focus:ring-primary dark:bg-gray-700 w-5 h-5">
                  <label for="source-netease" class="text-base dark:text-white cursor-pointer">网易云音乐</label>
                </div>
                <div
                  class="flex items-center gap-3 p-2 rounded hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200">
                  <input type="checkbox" id="source-qq"
                    class="rounded text-primary focus:ring-primary dark:bg-gray-700 w-5 h-5">
                  <label for="source-qq" class="text-base dark:text-white cursor-pointer">QQ音乐</label>
                </div>
                <div
                  class="flex items-center gap-3 p-2 rounded hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200">
                  <input type="checkbox" id="source-kugou"
                    class="rounded text-primary focus:ring-primary dark:bg-gray-700 w-5 h-5">
                  <label for="source-kugou" class="text-base dark:text-white cursor-pointer">酷狗音乐</label>
                </div>
                <div
                  class="flex items-center gap-3 p-2 rounded hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200">
                  <input type="checkbox" id="source-kuwo"
                    class="rounded text-primary focus:ring-primary dark:bg-gray-700 w-5 h-5">
                  <label for="source-kuwo" class="text-base dark:text-white cursor-pointer">酷我音乐</label>
                </div>
                <div
                  class="flex items-center gap-3 p-2 rounded hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200">
                  <input type="checkbox" id="source-migu"
                    class="rounded text-primary focus:ring-primary dark:bg-gray-700 w-5 h-5">
                  <label for="source-migu" class="text-base dark:text-white cursor-pointer">咪咕音乐</label>
                </div>
                <div
                  class="flex items-center gap-3 p-2 rounded hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200">
                  <input type="checkbox" id="source-qianqian"
                    class="rounded text-primary focus:ring-primary dark:bg-gray-700 w-5 h-5">
                  <label for="source-qianqian" class="text-base dark:text-white cursor-pointer">千千音乐</label>
                </div>
                <div
                  class="flex items-center gap-3 p-2 rounded hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200">
                  <input type="checkbox" id="source-soda"
                    class="rounded text-primary focus:ring-primary dark:bg-gray-700 w-5 h-5">
                  <label for="source-soda" class="text-base dark:text-white cursor-pointer">汽水音乐</label>
                </div>
                <div
                  class="flex items-center gap-3 p-2 rounded hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200">
                  <input type="checkbox" id="source-fivesing"
                    class="rounded text-primary focus:ring-primary dark:bg-gray-700 w-5 h-5">
                  <label for="source-fivesing" class="text-base dark:text-white cursor-pointer">5sing</label>
                </div>
                <div
                  class="flex items-center gap-3 p-2 rounded hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200">
                  <input type="checkbox" id="source-jamendo"
                    class="rounded text-primary focus:ring-primary dark:bg-gray-700 w-5 h-5">
                  <label for="source-jamendo" class="text-base dark:text-white cursor-pointer">Jamendo</label>
                </div>
                <div
                  class="flex items-center gap-3 p-2 rounded hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200">
                  <input type="checkbox" id="source-joox"
                    class="rounded text-primary focus:ring-primary dark:bg-gray-700 w-5 h-5">
                  <label for="source-joox" class="text-base dark:text-white cursor-pointer">JOOX</label>
                </div>
                <div
                  class="flex items-center gap-3 p-2 rounded hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200">
                  <input type="checkbox" id="source-bilibili"
                    class="rounded text-primary focus:ring-primary dark:bg-gray-700 w-5 h-5">
                  <label for="source-bilibili" class="text-base dark:text-white cursor-pointer">Bilibili</label>
                </div>
              </div>
              <div class="mt-4 flex justify-end gap-3">
                <button id="sourceSelectAllBtn"
                  class="px-4 py-2 text-sm text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 rounded hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200">全选</button>
                <button id="sourceResetBtn"
                  class="px-4 py-2 text-sm text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 rounded hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200">重置</button>
              </div>
            </div>
          </div>
        </div>
        <!-- 主题切换按钮 -->
        <button id="theme-toggle"
          class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-2 px-4 rounded-full transition-all duration-200 dark:bg-gray-700 dark:text-white dark:hover:bg-gray-600 flex items-center gap-2">
          <svg id="theme-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          切换主题
        </button>
        <button id="searchBtn"
          class="bg-primary hover:bg-primary/90 text-white font-medium py-2 px-4 rounded-full transition-all duration-200">
          搜索
        </button>
      </div>

      <!-- 内容区域 -->
      <div class="flex-1 overflow-y-auto p-6">
        <!-- 搜索结果 -->
        <div id="searchResultsSection" class="mb-8 hidden">
          <h2 class="text-xl font-bold mb-2 dark:text-white">搜索结果</h2>
          <div id="searchDownloadToolbar"
            class="mb-3 flex flex-wrap items-center gap-3 text-sm text-gray-600 dark:text-gray-300">
            <label class="flex cursor-pointer items-center gap-1">
              <input type="checkbox" id="searchSelectAllCheckbox" class="selection-sq-checkbox" />
              全选本页
            </label>
            <button type="button" id="downloadSearchToolbarBtn"
              class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-800 rounded-lg transition-colors duration-200 flex items-center gap-2 dark:bg-gray-700 dark:text-white dark:hover:bg-gray-600">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
              </svg>
              下载
            </button>
          </div>
          <div class="bg-gray-100 rounded-lg overflow-hidden dark:bg-gray-800">
            <ul id="searchResultList"
              class="divide-y divide-gray-700 dark:divide-gray-700 max-h-[700px] overflow-y-auto">
              <!-- 搜索结果动态渲染 -->
            </ul>
            <div class="p-4 text-center">
              <button id="loadMoreBtn" class="text-primary hover:text-primary/80 transition-colors duration-200 hidden">
                加载更多
              </button>
            </div>
          </div>
        </div>

        <!-- 歌单详情 -->
        <div id="playlistDetailSection" class="mb-8 hidden">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-xl font-bold dark:text-white" id="playlistDetailTitle">歌单详情</h2>
            <!-- 新增：本地歌单导入按钮，默认隐藏 -->
            <button id="importLocalBtn"
              class="px-4 py-2 bg-primary hover:bg-primary/90 text-white rounded-lg transition-colors duration-200 hidden">
              导入
            </button>
          </div>

          <!-- 歌单信息区域 -->
          <div class="flex items-start justify-between mb-6" id="playlistInfoArea">
            <div class="flex items-start">
              <div class="mr-4 flex flex-col items-center">
                <div id="playlistCoverContainer">
                  <img id="playlistCoverImg" src="" alt="歌单封面" class="w-20 h-20 rounded-lg shadow-md object-cover"
                    loading="lazy">
                </div>
                <label
                  class="playlist-detail-select-all mt-2 flex cursor-pointer items-center gap-1 text-sm text-gray-600 dark:text-gray-400">
                  <input type="checkbox" id="playlistDetailSelectAllCheckbox"
                    class="selection-sq-checkbox" />
                  全选
                </label>
              </div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2">
                  <h3 class="text-lg font-semibold dark:text-white" id="playlistDetailName">歌单名称</h3>
                  <span class="text-sm text-gray-500 dark:text-gray-400" id="playlistSongCount">0首</span>

              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
            导入歌单
          </button>
          <button type="button" id="cancelPlaylistBtn"
            class="px-4 py-2 bg-gray-300 hover:bg-gray-400 text-gray-800 rounded transition-colors duration-200 dark:bg-gray-700 dark:text-white dark:hover:bg-gray-600">
            取消
          </button>
          <button type="submit" id="savePlaylistBtn"
            class="px-4 py-2 bg-primary hover:bg-primary/90 text-white rounded transition-colors duration-200">
            创建

  <!-- 删除确认模态框 -->
  <div id="deleteConfirmModal"
    class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl w-full max-w-md p-6">
      <h2 class="text-xl font-bold mb-4 dark:text-white">确认删除</h2>
      <p class="mb-6 dark:text-white" id="deleteConfirmMessage">确定要删除吗？</p>
      <div class="flex justify-end gap-3">
        <button type="button" id="cancelDeleteBtn"
          class="px-4 py-2 bg-gray-300 hover:bg-gray-400 text-gray-800 rounded transition-colors duration-200 dark:bg-gray-700 dark:text-white dark:hover:bg-gray-600">
          取消
        </button>
        <button type="button" id="confirmDeleteBtn"
          class="px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded transition-colors duration-200">
          确认删除

  <script src="./js/app.js"></script>
  <script>
      // 主题切换功能
      (function () {
        // 获取元素
        const toggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');

        // 主题管理对象
        const themeManager = {
          mode: 'light', // 'light' 或 'dark'

          // 应用主题（更新 DOM 和本地存储）
          apply(mode) {
            this.mode = mode;
            // 操作 html 的 dark 类（Tailwind 暗黑模式基于 .dark 类）
            document.documentElement.classList.toggle('dark', mode === 'dark');
            // 更新图标
            if (mode === 'dark') {
              themeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />';
            } else {
              themeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />';
            }
            // 保存到 localStorage
            localStorage.setItem('theme-mode', mode);
          },

          // 切换主题
          toggle() {
            const newMode = this.mode === 'light' ? 'dark' : 'light';
            this.apply(newMode);
          },

          // 初始化主题
          init() {
            // 1. 优先从 localStorage 读取
            const saved = localStorage.getItem('theme-mode');
            if (saved === 'dark' || saved === 'light') {
              this.apply(saved);
              return;
            }

            // 2. 监听系统主题
            const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
            const systemMode = mediaQuery.matches ? 'dark' : 'light';
            this.apply(systemMode);

            // 3. 当系统主题变化时，且用户未手动覆盖，则跟随变化
            mediaQuery.addEventListener('change', (e) => {
              if (!localStorage.getItem('theme-mode')) {
                this.apply(e.matches ? 'dark' : 'light');
              }
            });
          }
        };

        // 绑定点击事件
        toggleBtn.addEventListener('click', () => themeManager.toggle());

        // 启动初始化
        themeManager.init();
      })();

    // 搜索源选择功能
    (function () {
      // 获取元素
      const sourceBtn = document.getElementById('searchSourceBtn');
      const sourceMenu = document.getElementById('searchSourceMenu');
      const sourceSelectAllBtn = document.getElementById('sourceSelectAllBtn');
      const sourceResetBtn = document.getElementById('sourceResetBtn');
      const sourceCheckboxes = document.querySelectorAll('#searchSourceMenu input[type="checkbox"]');

      // 切换下拉菜单
      sourceBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        sourceMenu.classList.toggle('hidden');
      });

      // 点击外部关闭下拉菜单
      document.addEventListener('click', (e) => {
        // 当点击搜索框、搜索按钮或其他区域时，关闭搜索源菜单
        if (!sourceBtn.contains(e.target) && !sourceMenu.contains(e.target)) {
          sourceMenu.classList.add('hidden');
        }
      });

      // 全选按钮
      sourceSelectAllBtn.addEventListener('click', () => {
        sourceCheckboxes.forEach(checkbox => {
          checkbox.checked = true;
        });
        // 手动触发保存操作
        const selectedSources = [];
        sourceCheckboxes.forEach(cb => {
          if (cb.checked) {
            selectedSources.push(cb.id.replace('source-', ''));
          }
        });
        // 保存到本地存储
        localStorage.setItem('selected-search-sources', JSON.stringify(selectedSources));
        console.log(`[搜索源] 全选后保存：${JSON.stringify(selectedSources)}`);
      });

      // 重置按钮
      sourceResetBtn.addEventListener('click', () => {
        sourceCheckboxes.forEach(checkbox => {
          checkbox.checked = false;
        });
        // 重置本地存储中的搜索源
        localStorage.setItem('selected-search-sources', JSON.stringify([]));
      });

      // 自动保存搜索源
      sourceCheckboxes.forEach(checkbox => {
        checkbox.addEventListener('change', () => {
          const selectedSources = [];
          sourceCheckboxes.forEach(cb => {
            if (cb.checked) {
              selectedSources.push(cb.id.replace('source-', ''));
            }
          });
          // 保存到本地存储
          localStorage.setItem('selected-search-sources', JSON.stringify(selectedSources));
          console.log(`[搜索源] 自动保存选择：${JSON.stringify(selectedSources)}`);
        });
      });



      // 初始化搜索源选择
      function initSearchSources() {
        const savedSources = localStorage.getItem('selected-search-sources');
        if (savedSources) {
          try {
            const sources = JSON.parse(savedSources);
            sourceCheckboxes.forEach(checkbox => {
              const source = checkbox.id.replace('source-', '');
              checkbox.checked = sources.includes(source);
            });
          } catch (error) {
            console.error('解析搜索源失败:', error);
          }
        }
      }

      // 启动初始化
      initSearchSources();
    })();
  </script>

  <!-- 更新提示模态框 -->
  <div id="updateModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
