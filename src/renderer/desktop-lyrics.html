<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>桌面歌词</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      user-select: none;
    }
    #dlWrap {
      -webkit-app-region: drag;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 46px 10px 20px;
      cursor: move;
    }
    .dl-near {
      font-size: 15px;
      line-height: 1.3;
      color: rgba(255, 255, 255, 0.5);
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #dlLine {
      font-size: 27px;
      font-weight: 700;
      line-height: 1.25;
      color: #ffffff;
      letter-spacing: 0.5px;
      text-align: center;
      text-shadow: 0 0 2px rgba(0,0,0,.95), 0 2px 10px rgba(0,0,0,.85), 0 0 18px rgba(29,185,84,.35);
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color .18s, transform .18s;
    }
    #dlLine.active { color: #1ed760; }
    #dlClose {
      -webkit-app-region: no-drag;
      position: fixed;
      top: 6px; right: 8px;
      width: 24px; height: 24px;
      border: none; border-radius: 50%;
      background: rgba(0,0,0,0.35);
      color: rgba(255,255,255,0.85);
      font-size: 14px; line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      transition: opacity .15s;
    }
    #dlWrap:hover #dlClose { opacity: 1; }
    #dlClose:hover { background: rgba(246,78,91,0.85); color: #fff; }
    #dlOpa {
      -webkit-app-region: no-drag;
      position: fixed;
      bottom: 2px; right: 10px;
      font-size: 11px;
      color: rgba(255,255,255,0.55);
      text-shadow: 0 1px 3px #000;
      opacity: 0;
      transition: opacity .2s;
    }
  </style>
</head>
<body>
  <div id="dlWrap">
    <div class="dl-near" id="dlPrev"></div>
    <div id="dlLine">♪</div>
    <div class="dl-near" id="dlNext"></div>
    <button id="dlClose" title="关闭桌面歌词">✕</button>
    <span id="dlOpa"></span>
  </div>
  <script>
    const api = window.ElectronAPI || {}
    const lineEl = document.getElementById("dlLine")
    const prevEl = document.getElementById("dlPrev")
    const nextEl = document.getElementById("dlNext")
    const opaEl = document.getElementById("dlOpa")
    const wrap = document.getElementById("dlWrap")
    let opacity = 0.92
    let opaTimer = null

    if (api.onDesktopLyricsLine) {
      api.onDesktopLyricsLine((d) => {
        prevEl.textContent = (d && d.prev) || ""
        nextEl.textContent = (d && d.next) || ""
        const text = (d && d.text) || ""
        lineEl.textContent = text || "♪"
        lineEl.classList.toggle("active", !!text)
        if (d && d.size) {
          const m = { small: [22, 12], medium: [27, 15], large: [33, 18] }[d.size]
          if (m) {
            lineEl.style.fontSize = m[0] + "px"
            prevEl.style.fontSize = nextEl.style.fontSize = m[1] + "px"
          }
        }
      })
    }

    if (api.setDesktopLyricsOpacity) {
      wrap.addEventListener("wheel", (e) => {
        e.preventDefault()
        opacity = Math.min(1, Math.max(0.15, opacity + (e.deltaY < 0 ? 0.05 : -0.05)))
        api.setDesktopLyricsOpacity(opacity)
        opaEl.textContent = Math.round(opacity * 100) + "%"
        opaEl.style.opacity = 1
        clearTimeout(opaTimer)
        opaTimer = setTimeout(() => (opaEl.style.opacity = 0), 900)
      }, { passive: false })
    }

    document.getElementById("dlClose").addEventListener("click", () => {
      if (api.desktopLyricsClose) api.desktopLyricsClose()
    })
    wrap.addEventListener("dblclick", () => {
      if (api.desktopLyricsClose) api.desktopLyricsClose()
    })
  </script>
</body>
</html>
