<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>桌面歌词</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      user-select: none;
    }
    #dlWrap {
      /* 不用 -webkit-app-region: drag：Windows 下 drag 区域被系统当标题栏，
         真实右键会弹出系统菜单（移动/大小/最小化/关闭），且鼠标事件到不了渲染层。
         改为 pointer 事件手动拖拽（见下方脚本），右键菜单 / 边缘缩放即可用真实鼠标操作 */
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 20px;
      cursor: move;
      border-radius: 12px;
      box-shadow: inset 0 0 0 1px transparent;
      transition: box-shadow .15s;
    }
    /* 悬停时描出窗口边界：透明窗平时看不到区域，方便找到边缘缩放热区。
       浅衬底 + 白描边：深浅桌面背景都能看清 */
    #dlWrap:hover {
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.4);
      background: rgba(0, 0, 0, 0.12);
    }
    #dlWrap.has-bg { background: rgba(0, 0, 0, 0.42); }
    .dl-near {
      font-size: 15px;
      line-height: 1.3;
      color: rgba(255, 255, 255, 0.5);
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #dlWrap.single-line .dl-near { display: none; }
    #dlWrap.single-line { gap: 0; }
    #dlLine {
      font-size: 27px;
      font-weight: 700;
      line-height: 1.25;
      color: #ffffff;
      letter-spacing: 0.5px;
      text-align: center;
      text-shadow: 0 0 2px rgba(0,0,0,.95), 0 2px 10px rgba(0,0,0,.85),
        0 0 18px rgba(var(--dl-accent-rgb, 29,185,84), .35);
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color .18s;
    }
    #dlLine.active { color: var(--dl-accent, #1ed760); }
    #dlTools {
      -webkit-app-region: no-drag;
      position: fixed;
      top: 4px;
      right: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
      opacity: 0;
      transition: opacity .15s;
      cursor: default;
    }
    #dlWrap:hover #dlTools { opacity: 1; }
    #dlTools button {
      width: 24px; height: 24px;
      border: none; border-radius: 50%;
      background: rgba(0,0,0,0.35);
      color: rgba(255,255,255,0.85);
      font-size: 12px; line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      padding: 0;
      white-space: nowrap;
    }
    #dlTools .dl-font-btn { width: auto; border-radius: 12px; padding: 0 7px; font-size: 11px; font-weight: 700; }
    #dlTools button:hover { background: rgba(255,255,255,0.22); color: #fff; }
    #dlTools button.on { background: rgba(255,255,255,0.28); color: #fff; box-shadow: 0 0 0 1px rgba(255,255,255,0.4) inset; }
    #dlClose:hover { background: rgba(246,78,91,0.85); color: #fff; }
    #dlColorBtn { border: 1px solid rgba(255,255,255,0.45); }
    .dl-sep { width: 1px; height: 14px; background: rgba(255,255,255,0.25); margin: 0 2px; }
    #dlLockedBadge {
      -webkit-app-region: no-drag;
      position: fixed;
      top: 8px;
      left: 10px;
      font-size: 11px;
      color: rgba(255,255,255,0.8);
      background: rgba(0,0,0,0.4);
      border-radius: 10px;
      padding: 2px 8px;
      text-shadow: 0 1px 3px #000;
      opacity: 0;
      transition: opacity .15s;
      pointer-events: none;
    }
    /* 锁定（点击穿透）时徽标是唯一常驻的非穿透入口：
       悬停经 forward 事件触发 → 临时恢复窗口鼠标交互 → 点击解锁 */
    body.locked #dlLockedBadge { opacity: 1; pointer-events: auto; cursor: pointer; }
    body.locked #dlLockedBadge:hover { background: var(--dl-accent, #1db954); color: #fff; }
    #dlOpa {
      position: fixed;
      bottom: 2px; right: 10px;
      font-size: 11px;
      color: rgba(255,255,255,0.55);
      text-shadow: 0 1px 3px #000;
      opacity: 0;
      transition: opacity .2s;
      pointer-events: none;
    }
    /* ===== 右键菜单 ===== */
    #dlMenu {
      -webkit-app-region: no-drag;
      position: fixed;
      z-index: 999;
      min-width: 196px;
      background: rgba(20, 20, 26, 0.96);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 10px;
      box-shadow: 0 10px 34px rgba(0,0,0,.55);
      padding: 5px;
      display: none;
      cursor: default;
      color: rgba(255,255,255,0.92);
      font-size: 13px;
      text-shadow: none;
    }
    #dlMenu.open { display: block; }
    .dlm-item {
      padding: 5px 10px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
    }
    .dlm-item:hover { background: rgba(255,255,255,0.1); }
    .dlm-item .dlm-check { margin-left: auto; opacity: 0; font-size: 12px; color: var(--dl-accent, #1ed760); }
    .dlm-item.checked .dlm-check { opacity: 1; }
    .dlm-item.dlm-danger:hover { background: rgba(246,78,91,0.82); }
    .dlm-sep { height: 1px; background: rgba(255,255,255,0.1); margin: 5px 8px; }
    .dlm-row { padding: 5px 10px; display: flex; align-items: center; gap: 8px; }
    .dlm-row .dlm-row-label { color: rgba(255,255,255,0.6); font-size: 12px; }
    .dlm-colors { display: flex; align-items: center; gap: 7px; padding: 5px 10px 7px; }
    .dlm-swatch {
      width: 16px; height: 16px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid rgba(255,255,255,0.25);
      padding: 0;
    }
    .dlm-swatch:hover { border-color: rgba(255,255,255,0.7); }
    .dlm-swatch.active { border-color: #fff; }
    .dlm-swatch.follow {
      background: conic-gradient(#1db954, #3b82f6, #8b5cf6, #ec4899, #f97316, #ef4444, #1db954);
    }
    #dlmOpa { flex: 1; accent-color: var(--dl-accent, #1ed760); cursor: pointer; }
    /* ===== 边缘拖拽自定义调整大小（透明窗无原生缩放边框）===== */
    .dl-resize {
      position: fixed;
      z-index: 900;
      background: transparent;
      transition: background .12s;
    }
    /* 悬停高亮缩放热区，让不可见的边缘可被发现 */
    .dl-resize:hover { background: rgba(255, 255, 255, 0.18); }
    .dl-resize.r { top: 0; right: 0; width: 10px; height: 100%; cursor: ew-resize; }
    .dl-resize.l { top: 0; left: 0; width: 10px; height: 100%; cursor: ew-resize; }
    .dl-resize.b { bottom: 0; left: 0; width: 100%; height: 10px; cursor: ns-resize; }
    .dl-resize.br { right: 0; bottom: 0; width: 20px; height: 20px; cursor: nwse-resize; }
    .dl-resize.bl { left: 0; bottom: 0; width: 20px; height: 20px; cursor: nesw-resize; }
  </style>
</head>
<body>
  <div id="dlWrap">
    <div class="dl-near" id="dlPrev"></div>
    <div id="dlLine">♪</div>
    <div class="dl-near" id="dlNext"></div>
    <span id="dlLockedBadge" title="点击解锁（恢复桌面歌词的鼠标交互）">🔒 已锁定 · 点击解锁</span>
    <div id="dlTools">
      <button id="dlPrevBtn" title="上一首">⏮</button>
      <button id="dlPlayBtn" title="播放 / 暂停">▶</button>
      <button id="dlNextBtn" title="下一首">⏭</button>
      <span class="dl-sep"></span>
      <button id="dlFontMinus" class="dl-font-btn" title="减小字号">A-</button>
      <button id="dlFontPlus" class="dl-font-btn" title="增大字号">A+</button>
      <button id="dlColorBtn" title="歌词颜色：循环色板，首项跟随主题色"></button>
      <button id="dlLinesBtn" title="单行 / 双行（显示上下行）">≡</button>
      <button id="dlBgBtn" title="背景衬底开关">▢</button>
      <span class="dl-sep"></span>
      <button id="dlLockBtn" title="锁定（点击穿透，锁定后可点左上角徽标或悬停工具条解锁）">🔒</button>
      <button id="dlClose" title="关闭桌面歌词">✕</button>
    </div>
    <span id="dlOpa"></span>
  </div>
  <div id="dlMenu">
    <div class="dlm-item" data-act="toggle"><span id="dlmPlayIcon">▶</span><span id="dlmPlayLabel">播放</span></div>
    <div class="dlm-item" data-act="prev">⏮ 上一首</div>
    <div class="dlm-item" data-act="next">⏭ 下一首</div>
    <div class="dlm-sep"></div>
    <div class="dlm-item" data-act="font-minus"><span style="font-weight:700">A−</span> 减小字号</div>
    <div class="dlm-item" data-act="font-plus"><span style="font-weight:700">A+</span> 增大字号</div>
    <div class="dlm-colors" id="dlmColors"></div>
    <div class="dlm-sep"></div>
    <div class="dlm-item" data-act="single-line">≡ 单行模式<span class="dlm-check">✓</span></div>
    <div class="dlm-item" data-act="bg">▢ 背景衬底<span class="dlm-check">✓</span></div>
    <div class="dlm-row"><span class="dlm-row-label">透明度</span><input type="range" id="dlmOpa" min="15" max="100" step="5"></div>
    <div class="dlm-sep"></div>
    <div class="dlm-item" data-act="reset-size">⤢ 重置窗口大小</div>
    <div class="dlm-item" data-act="lock">🔒 锁定（点击穿透）<span class="dlm-check">✓</span></div>
    <div class="dlm-item dlm-danger" data-act="close">✕ 关闭桌面歌词</div>
  </div>
  <div class="dl-resize l" data-dir="l"></div>
  <div class="dl-resize r" data-dir="r"></div>
  <div class="dl-resize b" data-dir="b"></div>
  <div class="dl-resize bl" data-dir="bl"></div>
  <div class="dl-resize br" data-dir="br"></div>
  <script>
    const api = window.ElectronAPI || {}
    const lineEl = document.getElementById("dlLine")
    const prevEl = document.getElementById("dlPrev")
    const nextEl = document.getElementById("dlNext")
    const opaEl = document.getElementById("dlOpa")
    const playBtn = document.getElementById("dlPlayBtn")
    const lockBtn = document.getElementById("dlLockBtn")
    const colorBtn = document.getElementById("dlColorBtn")
    const linesBtn = document.getElementById("dlLinesBtn")
    const bgBtn = document.getElementById("dlBgBtn")
    const wrap = document.getElementById("dlWrap")
    let opacity = 0.92
    let opaTimer = null

    function store(k, v) { try { localStorage.setItem(k, v) } catch (e) {} }
    function load(k) { try { return localStorage.getItem(k) } catch (e) { return null } }

    // ===== 字号（本地控制 + 记忆）=====
    const SIZES = [20, 24, 28, 32, 38, 44]
    let sizeIdx = 2
    {
      const v = parseInt(load("dlSizeIdx"), 10)
      if (v >= 0 && v < SIZES.length) sizeIdx = v
    }
    function applyFont(persist) {
      lineEl.style.fontSize = SIZES[sizeIdx] + "px"
      prevEl.style.fontSize = nextEl.style.fontSize =
        Math.round(SIZES[sizeIdx] * 0.55) + "px"
      if (persist) store("dlSizeIdx", String(sizeIdx))
    }
    applyFont(false)
    document.getElementById("dlFontMinus").addEventListener("click", () => {
      sizeIdx = Math.max(0, sizeIdx - 1)
      applyFont(true)
    })
    document.getElementById("dlFontPlus").addEventListener("click", () => {
      sizeIdx = Math.min(SIZES.length - 1, sizeIdx + 1)
      applyFont(true)
    })

    // ===== 歌词颜色：跟随主题色 / 自定义色板 =====
    const ACCENTS = ["#1db954", "#3b82f6", "#8b5cf6", "#ec4899", "#f97316", "#ef4444"]
    let themeAccent = "#1db954" // 主窗口推送的主题色
    let colorMode = load("dlColorMode") || "follow" // follow | #rrggbb
    function hexToRgbTriplet(hex) {
      const m = /^#?([0-9a-f]{6})$/i.exec(hex || "")
      if (!m) return "29,185,84"
      const n = parseInt(m[1], 16)
      return ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255)
    }
    function activeColor() {
      return colorMode === "follow" ? themeAccent : colorMode
    }
    function applyDlColor(hex) {
      document.documentElement.style.setProperty("--dl-accent", hex)
      document.documentElement.style.setProperty("--dl-accent-rgb", hexToRgbTriplet(hex))
      colorBtn.style.background = hex
    }
    applyDlColor(activeColor())
    if (api.onDesktopLyricsAccent) {
      api.onDesktopLyricsAccent((hex) => {
        if (typeof hex === "string" && /^#[0-9a-fA-F]{6}$/.test(hex)) {
          themeAccent = hex
          if (colorMode === "follow") applyDlColor(themeAccent)
        }
      })
    }
    colorBtn.addEventListener("click", () => {
      if (colorMode === "follow") {
        colorMode = ACCENTS[0]
      } else {
        const i = ACCENTS.indexOf(colorMode)
        colorMode = i >= 0 && i < ACCENTS.length - 1 ? ACCENTS[i + 1] : "follow"
      }
      store("dlColorMode", colorMode)
      applyDlColor(activeColor())
      colorBtn.title =
        colorMode === "follow"
          ? "歌词颜色：跟随主题色"
          : "歌词颜色：" + colorMode + "（点击继续切换，循环后回到跟随主题）"
    })

    // ===== 单行 / 双行 =====
    function applySingleLine(on) {
      wrap.classList.toggle("single-line", on)
      linesBtn.classList.toggle("on", on)
      linesBtn.title = on ? "单行模式（点击恢复双行）" : "双行模式（点击切换单行）"
    }
    applySingleLine(load("dlSingleLine") === "1")
    linesBtn.addEventListener("click", () => {
      const on = !wrap.classList.contains("single-line")
      applySingleLine(on)
      store("dlSingleLine", on ? "1" : "0")
    })

    // ===== 背景衬底 =====
    function applyBg(on) {
      wrap.classList.toggle("has-bg", on)
      bgBtn.classList.toggle("on", on)
      bgBtn.title = on ? "背景衬底：开（点击关闭）" : "背景衬底：关（点击开启）"
    }
    applyBg(load("dlHasBg") === "1")
    bgBtn.addEventListener("click", () => {
      const on = !wrap.classList.contains("has-bg")
      applyBg(on)
      store("dlHasBg", on ? "1" : "0")
    })

    // ===== 歌词行 =====
    if (api.onDesktopLyricsLine) {
      api.onDesktopLyricsLine((d) => {
        prevEl.textContent = (d && d.prev) || ""
        nextEl.textContent = (d && d.next) || ""
        const text = (d && d.text) || ""
        lineEl.textContent = text || "♪"
        lineEl.classList.toggle("active", !!text)
      })
    }

    // ===== 播放状态（控制条图标 + 右键菜单项同步）=====
    function renderPlayIcon(playing) {
      playBtn.textContent = playing ? "❚❚" : "▶"
      const mi = document.getElementById("dlmPlayIcon")
      const ml = document.getElementById("dlmPlayLabel")
      if (mi) mi.textContent = playing ? "❚❚" : "▶"
      if (ml) ml.textContent = playing ? "暂停" : "播放"
    }
    renderPlayIcon(false)
    if (api.onDesktopLyricsPlayerState)
      api.onDesktopLyricsPlayerState((playing) => renderPlayIcon(!!playing))

    // ===== 播放控制 =====
    document.getElementById("dlPrevBtn").addEventListener("click", () => {
      if (api.desktopLyricsPlayerCtl) api.desktopLyricsPlayerCtl("prev")
    })
    playBtn.addEventListener("click", () => {
      if (api.desktopLyricsPlayerCtl) api.desktopLyricsPlayerCtl("toggle")
    })
    document.getElementById("dlNextBtn").addEventListener("click", () => {
      if (api.desktopLyricsPlayerCtl) api.desktopLyricsPlayerCtl("next")
    })

    // ===== 锁定（点击穿透）=====
    // 锁定后整窗点击穿透（forward 保留悬停）。左上角“已锁定”徽标与工具条
    // 悬停时临时恢复窗口鼠标交互，因此锁定后仍可点击解锁，无需进托盘菜单。
    const lockedBadge = document.getElementById("dlLockedBadge")
    function setWinInteractive(v) {
      if (
        document.body.classList.contains("locked") &&
        api.desktopLyricsSetInteractive
      )
        api.desktopLyricsSetInteractive(v)
    }
    lockBtn.addEventListener("click", () => {
      if (api.desktopLyricsLock)
        api.desktopLyricsLock(!document.body.classList.contains("locked"))
    })
    if (api.onDesktopLyricsLockState) {
      api.onDesktopLyricsLockState((locked) => {
        document.body.classList.toggle("locked", !!locked)
        lockBtn.classList.toggle("on", !!locked)
      })
    }
    lockedBadge.addEventListener("mouseenter", () => setWinInteractive(true))
    lockedBadge.addEventListener("mouseleave", () => setWinInteractive(false))
    lockedBadge.addEventListener("click", () => {
      if (api.desktopLyricsLock) api.desktopLyricsLock(false)
    })
    const toolsBar = document.getElementById("dlTools")
    toolsBar.addEventListener("mouseenter", () => setWinInteractive(true))
    toolsBar.addEventListener("mouseleave", () => setWinInteractive(false))
    // 双击歌词：切换锁定
    wrap.addEventListener("dblclick", () => {
      if (api.desktopLyricsLock)
        api.desktopLyricsLock(!document.body.classList.contains("locked"))
    })

    // ===== 手动拖拽窗口（替代 -webkit-app-region: drag，见顶部注释）=====
    // 渲染层用事件 screen 坐标算 delta，主进程按 delta 移动窗口
    let dragPid = null
    let dragStartScreen = null
    wrap.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return
      // 工具条 / 菜单 / 锁定徽标内的按下不进入拖拽
      if (
        e.target.closest("#dlTools") ||
        e.target.closest("#dlMenu") ||
        e.target.closest("#dlLockedBadge")
      )
        return
      if (menu.classList.contains("open")) return
      dragPid = e.pointerId
      dragStartScreen = { x: e.screenX, y: e.screenY }
      try { wrap.setPointerCapture(e.pointerId) } catch (err) {}
      if (api.desktopLyricsDragStart) api.desktopLyricsDragStart()
    })
    wrap.addEventListener("pointermove", (e) => {
      if (dragPid === null || e.pointerId !== dragPid) return
      if (api.desktopLyricsDragMove)
        api.desktopLyricsDragMove(e.screenX - dragStartScreen.x, e.screenY - dragStartScreen.y)
    })
    const endManualDrag = (e) => {
      if (dragPid === null || e.pointerId !== dragPid) return
      dragPid = null
      dragStartScreen = null
      if (api.desktopLyricsDragEnd) api.desktopLyricsDragEnd()
    }
    wrap.addEventListener("pointerup", endManualDrag)
    wrap.addEventListener("pointercancel", endManualDrag)

    // ===== 透明度滚轮 =====
    if (api.setDesktopLyricsOpacity) {
      wrap.addEventListener("wheel", (e) => {
        e.preventDefault()
        opacity = Math.min(1, Math.max(0.15, opacity + (e.deltaY < 0 ? 0.05 : -0.05)))
        api.setDesktopLyricsOpacity(opacity)
        opaEl.textContent = Math.round(opacity * 100) + "%"
        opaEl.style.opacity = 1
        clearTimeout(opaTimer)
        opaTimer = setTimeout(() => (opaEl.style.opacity = 0), 900)
      }, { passive: false })
    }

    document.getElementById("dlClose").addEventListener("click", () => {
      if (api.desktopLyricsClose) api.desktopLyricsClose()
    })

    // ===== 右键菜单 =====
    const menu = document.getElementById("dlMenu")
    const menuOpa = document.getElementById("dlmOpa")
    const colorsRow = document.getElementById("dlmColors")
    let menuAnchored = false

    // 色板：跟随主题 + 固定色
    function buildColorSwatches() {
      colorsRow.textContent = ""
      const mk = (cls, title, active, onClick) => {
        const b = document.createElement("button")
        b.className = "dlm-swatch" + (cls ? " " + cls : "") + (active ? " active" : "")
        b.title = title
        b.addEventListener("click", (e) => {
          e.stopPropagation()
          onClick()
          refreshMenu()
        })
        colorsRow.appendChild(b)
      }
      const setMode = (m) => {
        colorMode = m
        store("dlColorMode", colorMode)
        applyDlColor(activeColor())
      }
      mk("follow", "跟随主题色", colorMode === "follow", () => setMode("follow"))
      ACCENTS.forEach((c) => mk("", "歌词颜色：" + c, colorMode === c, () => setMode(c)))
    }

    function refreshMenu() {
      menu.querySelectorAll(".dlm-item").forEach((el) => {
        const act = el.getAttribute("data-act")
        let checked = false
        if (act === "single-line") checked = wrap.classList.contains("single-line")
        else if (act === "bg") checked = wrap.classList.contains("has-bg")
        else if (act === "lock") checked = document.body.classList.contains("locked")
        el.classList.toggle("checked", checked)
      })
      menuOpa.value = String(Math.round(opacity * 100))
      buildColorSwatches()
    }

    function showMenu(x, y) {
      refreshMenu()
      menu.classList.add("open")
      const r = menu.getBoundingClientRect()
      // 菜单高于窗口时，临时向上拉高透明窗口（底边固定）；
      // 歌词内容锚定到原底部区域，视觉位置不变
      const needH = r.height + 8
      if (window.innerHeight < needH && api.desktopLyricsMenuSize) {
        if (!menuAnchored) {
          const preH = window.innerHeight
          wrap.style.position = "fixed"
          wrap.style.left = "0"
          wrap.style.right = "0"
          wrap.style.top = "auto"
          wrap.style.bottom = "0"
          wrap.style.height = preH + "px"
          menuAnchored = true
        }
        api.desktopLyricsMenuSize(needH)
      }
      const availH = Math.max(window.innerHeight, Math.min(needH, 400))
      menu.style.left = Math.max(4, Math.min(x, window.innerWidth - r.width - 4)) + "px"
      menu.style.top = Math.max(4, Math.min(y, availH - r.height - 4)) + "px"
    }
    function hideMenu() {
      menu.classList.remove("open")
      if (api.desktopLyricsMenuSize) api.desktopLyricsMenuSize(0)
      if (menuAnchored) {
        menuAnchored = false
        wrap.style.position = ""
        wrap.style.left = ""
        wrap.style.right = ""
        wrap.style.top = ""
        wrap.style.bottom = ""
        wrap.style.height = ""
      }
    }

    document.addEventListener("contextmenu", (e) => {
      e.preventDefault()
      showMenu(e.clientX, e.clientY)
    })
    // 左键点到菜单外关闭（右键会先触发 contextmenu 重新定位，不关闭）
    document.addEventListener("mousedown", (e) => {
      if (e.button === 0 && !menu.contains(e.target)) hideMenu()
    })
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") hideMenu()
    })
    window.addEventListener("blur", hideMenu)

    menu.addEventListener("click", (e) => {
      const item = e.target.closest(".dlm-item")
      if (!item) return
      const act = item.getAttribute("data-act")
      switch (act) {
        case "toggle":
          if (api.desktopLyricsPlayerCtl) api.desktopLyricsPlayerCtl("toggle")
          break
        case "prev":
          if (api.desktopLyricsPlayerCtl) api.desktopLyricsPlayerCtl("prev")
          break
        case "next":
          if (api.desktopLyricsPlayerCtl) api.desktopLyricsPlayerCtl("next")
          break
        case "font-minus":
          document.getElementById("dlFontMinus").click()
          break
        case "font-plus":
          document.getElementById("dlFontPlus").click()
          break
        case "single-line":
          linesBtn.click()
          break
        case "bg":
          bgBtn.click()
          break
        case "lock":
          lockBtn.click()
          break
        case "reset-size":
          if (api.desktopLyricsResetSize) api.desktopLyricsResetSize()
          break
        case "close":
          if (api.desktopLyricsClose) api.desktopLyricsClose()
          break
      }
      if (act !== "toggle") hideMenu()
      else refreshMenu()
    })

    menuOpa.addEventListener("input", () => {
      opacity = parseInt(menuOpa.value, 10) / 100
      if (api.setDesktopLyricsOpacity) api.setDesktopLyricsOpacity(opacity)
      opaEl.textContent = Math.round(opacity * 100) + "%"
      opaEl.style.opacity = 1
      clearTimeout(opaTimer)
      opaTimer = setTimeout(() => (opaEl.style.opacity = 0), 900)
    })
    menuOpa.addEventListener("mousedown", (e) => e.stopPropagation())

    // ===== 边缘拖拽调整大小（透明窗无原生缩放边框，用窗口边缘热区自绘）=====
    document.querySelectorAll(".dl-resize").forEach((el) => {
      const dir = el.getAttribute("data-dir")
      el.addEventListener("pointerdown", (e) => {
        if (e.button !== 0) return
        e.preventDefault()
        hideMenu()
        el.setPointerCapture(e.pointerId)
        const startX = e.screenX
        const startY = e.screenY
        const startW = window.innerWidth
        const startH = window.innerHeight
        const minW = 360
        const maxW = Math.min(1400, window.screen.availWidth || 1400)
        const minH = 90
        const maxH = 400
        const onMove = (ev) => {
          const dx = ev.screenX - startX
          const dy = ev.screenY - startY
          let w = startW
          let h = startH
          // 左边缘：宽度变化同时平移窗口，保持右边不动
          if (dir === "l" || dir === "bl") w = Math.max(minW, Math.min(maxW, startW - dx))
          // 右边缘：向右拉伸宽度
          if (dir === "r" || dir === "br") w = Math.max(minW, Math.min(maxW, startW + dx))
          // 下边缘：向下拉伸高度
          if (dir === "b" || dir === "bl" || dir === "br")
            h = Math.max(minH, Math.min(maxH, startH + dy))
          if (w !== startW && (dir === "l" || dir === "bl")) window.moveBy(startW - w, 0)
          if (w !== startW || h !== startH) window.resizeTo(w, h)
        }
        const onUp = () => {
          el.removeEventListener("pointermove", onMove)
          el.removeEventListener("pointerup", onUp)
          el.removeEventListener("pointercancel", onUp)
        }
        el.addEventListener("pointermove", onMove)
        el.addEventListener("pointerup", onUp)
        el.addEventListener("pointercancel", onUp)
      })
    })
  </script>
</body>
</html>
